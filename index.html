  }).join('');

  showModal(`
    <div class="modal-header"><div class="modal-title">Detail ${type==='purchase'?'Pembelian':'Penjualan'}${tx.status==='draft'?' <span class="status warn">Draft</span>':''}</div><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div style="margin-bottom:16px">
        <div class="detail-row"><span class="label">${type==='purchase'?'No. PO':'No. Invoice'}:</span><strong>${tx.nomor}</strong></div>
        <div class="detail-row"><span class="label">Tanggal:</span><strong>${fmt.date(tx.tanggal)}</strong></div>
        <div class="detail-row"><span class="label">${pLabel}:</span><strong>${pVal}</strong></div>
      </div>
      ${type==='sale'?`<div style="text-align:right;margin-bottom:8px"><button type="button" class="btn sm ghost" id="detailToggleHpp">👁 HPP & Profit: ${hppVisible?'Terlihat':'Disembunyikan'}</button></div>`:''}
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Produk</th><th class="num">Qty</th><th class="num">${type==='purchase'?'Harga Beli':'Harga Jual'}</th>${type==='sale'?'<th class="num">Potongan</th><th class="num">HPP</th>':''}<th class="num">Subtotal</th>${type==='sale'?'<th class="num">Profit</th>':''}</tr></thead>
        <tbody id="detailItemsBody">${renderDetailItems()}</tbody>
      </table></div>
      <div class="totals">
        ${type==='sale'&&tx.diskonTotal>0?`<div class="totals-row"><span>Diskon Total:</span><strong style="color:var(--warn)">-${fmt.rp(tx.diskonTotal)}</strong></div>`:''}
        ${type==='sale'?`<div class="totals-row"><span>Total Profit:</span><strong class="profit">${hppVisible?fmt.rp(tx.totalProfit):'×××'}</strong></div>`:''}
        <div class="totals-row big"><span>Total:</span><strong>${fmt.rp(tx.total)}</strong></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" onclick="deleteTransaction('${type}','${id}')">Hapus</button>
      <div style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">Tutup</button>${type==='sale'?`<button class="btn" onclick="printInvoice('${id}')">Cetak</button>`:''}</div>
    </div>`);

  const toggleBtn = document.getElementById('detailToggleHpp');
  if (toggleBtn) toggleBtn.onclick = () => {
    hppVisible = !hppVisible;

    document.getElementById('detailItemsBody').innerHTML = renderDetailItems();

    const profitEl = document.querySelector('.totals .profit');
    if (profitEl) profitEl.textContent = hppVisible?fmt.rp(tx.totalProfit):'×××';
  };
}

async function deleteTransaction(type, id) {
  if(type==='purchase'){
    const pur=db.purchases.find(x=>x.id===id); if(!pur) return;
    const layerIds=db.layers.filter(l=>l.sourceId===id).map(l=>l.layerId);
    const used=db.sales.some(s=>s.items.some(it=>(it.consumptions||[]).some(c=>layerIds.includes(c.layerId))));
    if(used) return toast('Layer sudah dikonsumsi penjualan. Hapus penjualan terkait dulu.','err');
    if(!confirm('Hapus pembelian ini?')) return;
    setBadge('syncing');
    try {
      await sb.delete('layers',`?source_id=eq.${id}`);
      await sb.delete('purchases',`?id=eq.${id}`);
      db.layers=db.layers.filter(l=>l.sourceId!==id);
      db.purchases=db.purchases.filter(x=>x.id!==id);
      setBadge('online'); closeModal(); render(); toast('Pembelian dihapus');
    } catch(e){setBadge('online');toast('Gagal: '+e.message,'err');}
  } else {
    const sal=db.sales.find(x=>x.id===id); if(!sal) return;
    const isDraft = sal.status==='draft';
    if(!confirm(isDraft ? 'Hapus draft ini? Stock tidak terpengaruh (draft belum pernah memotong stock).' : 'Hapus penjualan ini? Stock akan dikembalikan.')) return;
    setBadge('syncing');
    try {
      // Restore layers in DB (no-op kalau draft, karena consumptions kosong)
      sal.items.forEach(it=>fifoRestoreLocal(it.consumptions));
      const updates={};
      sal.items.forEach(it=>(it.consumptions||[]).forEach(c=>{if(c.layerId){const l=db.layers.find(x=>x.layerId===c.layerId);if(l)updates[c.layerId]=l.qtyRemaining;}}));
      await Promise.all(Object.entries(updates).map(([lid,qty])=>sb.patch('layers',`?layer_id=eq.${lid}`,{qty_remaining:qty})));
      await sb.delete('sales',`?id=eq.${id}`);
      db.sales=db.sales.filter(x=>x.id!==id);
      setBadge('online'); closeModal(); render(); toast('Penjualan dihapus');
    } catch(e){setBadge('online');toast('Gagal: '+e.message,'err');}
  }
}

function exportData() {
  const data={products:db.products,purchases:db.purchases,sales:db.sales,adjustments:db.adjustments,layers:db.layers,counters:db.counters};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`feoni-steel-backup-${fmt.today()}.json`; a.click(); URL.revokeObjectURL(url);
  toast('Backup didownload');
}

async function importFromLocalJSON(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try {
      const data=JSON.parse(ev.target.result);
      if(!data.products) throw new Error('Format tidak valid');
      if(!confirm(`Import ${data.products.length} produk, ${data.purchases?.length||0} pembelian, ${data.sales?.length||0} penjualan ke Supabase?\n\nData yang sudah ada di database TIDAK akan dihapus — hanya ditambahkan yang belum ada.`)) return;
      setBadge('syncing');
      toast('Mengimport data...','warn');
      // Upsert produk
      if(data.products?.length) {
        const rows=data.products.map(p=>({id:p.id,nama:p.nama,kode:p.kode||'',satuan:p.satuan||'Pcs',harga_beli:p.hargaBeli||0,harga_jual:p.hargaJual||0,buffer:p.buffer||0}));
        await sb.post('products',rows,'resolution=ignore-duplicates,return=minimal');
      }
      if(data.layers?.length) {
        const rows=data.layers.map(l=>({layer_id:l.layerId,product_id:l.productId,qty_remaining:l.qtyRemaining,harga_beli:l.hargaBeli,source_id:l.sourceId,source_type:l.sourceType,tanggal:l.tanggal}));
        await sb.post('layers',rows,'resolution=ignore-duplicates,return=minimal');
      }
      if(data.purchases?.length) {
        for(const p of data.purchases){
          await sb.post('purchases',[{id:p.id,nomor:p.nomor,tanggal:p.tanggal,supplier:p.supplier,total:p.total}],'resolution=ignore-duplicates,return=minimal');
          if(p.items?.length){const items=p.items.map(it=>({purchase_id:p.id,product_id:it.productId,qty:it.qty,harga_beli:it.hargaBeli,subtotal:it.subtotal}));await sb.post('purchase_items',items,'resolution=ignore-duplicates,return=minimal');}
        }
      }
      if(data.sales?.length) {
        for(const s of data.sales){
          await sb.post('sales',[{id:s.id,nomor:s.nomor,tanggal:s.tanggal,customer:s.customer,total:s.total,total_profit:s.totalProfit||0}],'resolution=ignore-duplicates,return=minimal');
          if(s.items?.length){const items=s.items.map(it=>({sale_id:s.id,product_id:it.productId,qty:it.qty,harga_jual:it.hargaJual,hpp:it.hpp||0,subtotal:it.subtotal,profit:it.profit||0,consumptions:it.consumptions||[]}));await sb.post('sale_items',items,'resolution=ignore-duplicates,return=minimal');}
        }
      }
      if(data.adjustments?.length) {
        const rows=data.adjustments.map(a=>({id:a.id,nomor:a.nomor,tanggal:a.tanggal,product_id:a.productId,qty:a.qty,alasan:a.alasan,keterangan:a.keterangan||'',harga_beli:a.hargaBeli||0,consumptions:a.consumptions||[]}));
        await sb.post('adjustments',rows,'resolution=ignore-duplicates,return=minimal');
      }
      await loadAll();
      toast('Import selesai!');
    } catch(err) { setBadge('online'); toast('Gagal import: '+err.message,'err'); }
    e.target.value='';
  };
  reader.readAsText(file);
}

// LABA RUGI — helper tanggal
// ============================================================
function startOfWeek(d) { const dt=new Date(d); const day=dt.getDay(); const diff=(day===0?-6:1-day); dt.setDate(dt.getDate()+diff); dt.setHours(0,0,0,0); return dt; }
function startOfMonth(d) { const dt=new Date(d); dt.setDate(1); dt.setHours(0,0,0,0); return dt; }
function startOfYear(d) { const dt=new Date(d); dt.setMonth(0,1); dt.setHours(0,0,0,0); return dt; }
function addDays(d,n) { const dt=new Date(d); dt.setDate(dt.getDate()+n); return dt; }
function addMonths(d,n) { const dt=new Date(d); dt.setMonth(dt.getMonth()+n); return dt; }
function addYears(d,n) { const dt=new Date(d); dt.setFullYear(dt.getFullYear()+n); return dt; }
function fmtShortDate(d) { return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}); }
function fmtMonthYear(d) { return d.toLocaleDateString('id-ID',{month:'short',year:'numeric'}); }

// Agregasi laba-rugi untuk rentang [start, end) — end eksklusif
function aggregatePeriod(start, end) {
  const inRange = (tgl) => { const d=new Date(tgl); return d>=start && d<end; };
  const sales = db.sales.filter(s=>s.status!=='draft').filter(s=>inRange(s.tanggal));
  const revenue = sales.reduce((a,s)=>a+s.total,0);
  const grossProfit = sales.reduce((a,s)=>a+(s.totalProfit||0),0);
  const cogs = revenue - grossProfit;
  const lossAdj = db.adjustments.filter(a=>inRange(a.tanggal) && a.qty<0 && (a.alasan==='Barang Rusak'||a.alasan==='Barang Hilang'));
  const lossValue = lossAdj.reduce((a,adj)=>a+(adj.consumptions||[]).reduce((s,c)=>s+(c.qty*c.hargaBeli),0),0);
  const expensesInRange = db.expenses.filter(e=>inRange(e.tanggal));
  const totalExpenses = expensesInRange.reduce((a,e)=>a+e.jumlah,0);
  const expenseByCategory = {};
  expensesInRange.forEach(e=>{ expenseByCategory[e.kategori] = (expenseByCategory[e.kategori]||0) + e.jumlah; });
  const netProfit = grossProfit - lossValue - totalExpenses;
  const margin = revenue>0 ? (netProfit/revenue*100) : 0;
  return { revenue, cogs, grossProfit, lossValue, totalExpenses, expenseByCategory, netProfit, margin, txCount: sales.length };
}

function buildTrend(mode) {
  const now = new Date();
  const buckets = [];
  if (mode==='minggu') {
    const curStart = startOfWeek(now);
    for (let i=7; i>=0; i--) {
      const start = addDays(curStart, -7*i);
      const end = addDays(start, 7);
      buckets.push({ label: fmtShortDate(start)+' - '+fmtShortDate(addDays(end,-1)), start, end, isCurrent: i===0 });
    }
  } else if (mode==='bulan') {
    const curStart = startOfMonth(now);
    for (let i=11; i>=0; i--) {
      const start = addMonths(curStart, -i);
      const end = addMonths(start, 1);
      buckets.push({ label: fmtMonthYear(start), start, end, isCurrent: i===0 });
    }
  } else { // tahun
    const curStart = startOfYear(now);
    for (let i=4; i>=0; i--) {
      const start = addYears(curStart, -i);
      const end = addYears(start, 1);
      buckets.push({ label: String(start.getFullYear()), start, end, isCurrent: i===0 });
    }
  }
  return buckets.map(b => ({ ...b, ...aggregatePeriod(b.start, b.end) }));
}
