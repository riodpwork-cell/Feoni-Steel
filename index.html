  .brand h1 { font-size: 16px; font-weight: 600; }
  .brand small { color: var(--text-dim); font-size: 11px; display: block; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }

  .conn-badge.offline { background: rgba(239,68,68,0.15); color: #f87171; }

  main { padding: 24px 20px; max-width: 1400px; margin: 0 auto; }

  .page-subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card-label { color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .card-value { font-size: 22px; font-weight: 600; }
  .card-sub { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
  .panel-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .panel-title { font-weight: 600; font-size: 15px; }
  .panel-body { padding: 16px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=number], input[type=date], select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.15s; }

  input[type=text].search { min-width: 220px; }

  button.btn:hover { background: var(--border); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.btn.primary:hover { background: #d64a20; }
  button.btn.ghost { background: transparent; }
  button.btn.danger { color: var(--danger); }
  button.btn.danger:hover { background: var(--danger); color: white; border-color: var(--danger); }
  button.btn.sm { padding: 5px 10px; font-size: 12px; }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 12px; color: var(--text-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--panel-2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .status.ok { background: rgba(34,197,94,0.15); color: #4ade80; }
  .status.warn { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .status.danger { background: rgba(239,68,68,0.15); color: #f87171; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 920px; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-body { padding: 20px; }
  .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 12px; color: var(--text-dim); font-weight: 500; }
  .form-field input, .form-field select { width: 100%; }
  .tx-items { margin-top: 16px; }

  .tx-items td { padding: 6px 10px; vertical-align: top; }

  .tx-items .col-qty { width: 90px; }
  .tx-items .col-price { width: 130px; }
  .tx-items .col-total { width: 140px; }
  .tx-items .col-act { width: 40px; }
  .tx-items td:nth-child(2) { min-width: 200px; }
  .tx-items .remove-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .tx-items .remove-btn:hover { color: var(--danger); }
  .totals { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; margin-top: 16px; padding: 12px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); }

  .totals-row .profit { color: var(--ok); }

  .empty { text-align: center; padding: 48px 20px; color: var(--text-dim); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel); border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); opacity: 0; transform: translateY(20px); transition: all 0.2s; pointer-events: none; z-index: 200; max-width: 400px; }

function checkSession() {
  return sessionStorage.getItem(SESSION_KEY) === 'ok';

function showLoginScreen() {
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  setTimeout(() => document.getElementById('loginInput').focus(), 100);
}
function tryLogin() {
  const val = document.getElementById('loginInput').value;
  if (val === APP_PASSWORD) {
    sessionStorage.setItem(SESSION_KEY, 'ok');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-root').style.display = 'block';
    loadAll();

    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginInput').value = '';
    document.getElementById('loginInput').focus();
  }
}

// ============================================================
// SUPABASE API CLIENT (lightweight, tanpa library)
// ============================================================
const sb = {
  headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
  url: (table, qs='') => `${SUPABASE_URL}/rest/v1/${table}${qs}`,

  async get(table, qs='') {
    const r = await fetch(sb.url(table, qs), { headers: { ...sb.headers, 'Prefer': 'return=representation' } });
    if (!r.ok) throw new Error(`GET ${table}: ${r.status} ${await r.text()}`);
    return r.json();
  },
  async post(table, body, prefer='return=representation') {
    const r = await fetch(sb.url(table), { method:'POST', headers: { ...sb.headers, 'Prefer': prefer }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(`POST ${table}: ${r.status} ${await r.text()}`);
    return prefer.includes('representation') ? r.json() : null;
  },
  async patch(table, qs, body) {
    const r = await fetch(sb.url(table, qs), { method:'PATCH', headers: { ...sb.headers, 'Prefer': 'return=representation' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(`PATCH ${table}: ${r.status} ${await r.text()}`);
    return r.json();
  },
  async delete(table, qs) {
    const r = await fetch(sb.url(table, qs), { method:'DELETE', headers: sb.headers });
    if (!r.ok) throw new Error(`DELETE ${table}: ${r.status} ${await r.text()}`);
    return true;
  },
  async rpc(fn, params={}) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers: sb.headers, body: JSON.stringify(params) });
    if (!r.ok) throw new Error(`RPC ${fn}: ${r.status} ${await r.text()}`);
    return r.json();
  }
};

function escapeHtml(s) { if(!s) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

// ============================================================
// FIFO ENGINE (operasi di in-memory db.layers)
// ============================================================
function getLayersForProduct(productId) {
  return db.layers.filter(l => l.productId===productId && l.qtyRemaining>0)
    .sort((a,b) => new Date(a.tanggal)-new Date(b.tanggal));
}
function getStock(pid) { return db.layers.filter(l=>l.productId===pid).reduce((a,l)=>a+l.qtyRemaining,0); }
function getStockValue(pid) { return db.layers.filter(l=>l.productId===pid).reduce((a,l)=>a+l.qtyRemaining*l.hargaBeli,0); }
function getAvgHpp(pid) { const s=getStock(pid); return s<=0?0:getStockValue(pid)/s; }
function getOldestLayerPrice(pid) { const ls=getLayersForProduct(pid); return ls.length>0?ls[0].hargaBeli:0; }
function getProduct(id) { return db.products.find(p=>p.id===id); }

// ============================================================
// VENDOR PRICES — helper
// ============================================================
function getVendorPrices(productId) {
  return db.vendorPrices.filter(v=>v.productId===productId).sort((a,b)=>a.harga-b.harga);
}
function getCheapestVendor(productId) {
  const vs = getVendorPrices(productId);
  return vs.length>0 ? vs[0] : null;
}

// Simulate FIFO tanpa mutate (untuk preview margin)
function fifoSimulate(productId, qty, fallback) {
  const layers = getLayersForProduct(productId).map(l=>({...l}));
  let rem=qty, totalHpp=0; const batches=[];
  for (const l of layers) {
    if (rem<=0) break;
    const take=Math.min(rem,l.qtyRemaining);
    totalHpp+=take*l.hargaBeli; batches.push({qty:take,harga:l.hargaBeli}); rem-=take;
  }
  if (rem>0) { totalHpp+=rem*(fallback||0); batches.push({qty:rem,harga:fallback||0,_fallback:true}); }
  return { totalHpp, batches, avgHpp: totalHpp/qty, shortfall: rem };
}

// Real consume (mutate local, lalu persist ke DB)
function fifoConsumeLocal(productId, qty, fallback) {
  const layers = getLayersForProduct(productId);
  const consumptions=[]; let rem=qty, totalHpp=0;
  for (const l of layers) {
    if (rem<=0) break;
    const take=Math.min(rem,l.qtyRemaining);
    l.qtyRemaining-=take; rem-=take; totalHpp+=take*l.hargaBeli;
    consumptions.push({layerId:l.layerId,qty:take,hargaBeli:l.hargaBeli});
  }
  if (rem>0) { totalHpp+=rem*(fallback||0); consumptions.push({layerId:null,qty:rem,hargaBeli:fallback||0,_shortfall:true}); }
  return { consumptions, totalHpp, avgHpp: totalHpp/qty };
}

function fifoRestoreLocal(consumptions) {
  if (!consumptions) return;
  consumptions.forEach(c => {
    if (!c.layerId) return;
    const l = db.layers.find(x=>x.layerId===c.layerId);
    if (l) l.qtyRemaining+=c.qty;
  });
}

      sourceId: l.source_id, sourceType: l.source_type, tanggal: l.tanggal
    }));

    // Attach items ke purchases & sales
    const piMap = {}; purchaseItems.forEach(i => { if (!piMap[i.purchase_id]) piMap[i.purchase_id]=[]; piMap[i.purchase_id].push(i); });
    const siMap = {}; saleItems.forEach(i => { if (!siMap[i.sale_id]) siMap[i.sale_id]=[]; siMap[i.sale_id].push(i); });

    db.purchases = purchases.map(p => ({
      id: p.id, nomor: p.nomor, tanggal: p.tanggal, supplier: p.supplier, total: Number(p.total),
      items: (piMap[p.id]||[]).map(i => ({

        consumptions: i.consumptions||[]

      id: a.id, nomor: a.nomor, tanggal: a.tanggal, productId: a.product_id,
      qty: Number(a.qty), alasan: a.alasan, keterangan: a.keterangan||'',
      hargaBeli: Number(a.harga_beli), consumptions: a.consumptions||[]

    db.priceHistory = priceHistory.map(h => ({

async function runImportMasterData() {
  closeModal();
  setBadge('syncing');
  toast('Menghapus data lama...', 'warn');
  try {
    // Hapus semua data lama (aman — sudah dikonfirmasi tidak ada transaksi asli)
    // Urutan: anak dulu baru induk, karena FK
    await sb.delete('sale_items', '?id=not.is.null');
    await sb.delete('purchase_items', '?id=not.is.null');
    await sb.delete('sales', '?id=not.is.null');
    await sb.delete('purchases', '?id=not.is.null');
    await sb.delete('adjustments', '?id=not.is.null');
    await sb.delete('layers', '?layer_id=not.is.null');
    await sb.delete('price_history', '?id=not.is.null');
    await sb.delete('vendor_prices', '?id=not.is.null');
    await sb.delete('products', '?id=not.is.null');

    toast(`Mengimport ${MASTER_IMPORT_DATA.products.length} produk baru...`, 'warn');

    // Insert produk baru
    const productRows = MASTER_IMPORT_DATA.products.map(p => ({
      id: p.id, nama: p.nama, kode: p.kode, satuan: p.satuan,
      harga_beli: p.hargaBeli, harga_jual: p.hargaJual, buffer: p.buffer
    }));
    // Insert dalam batch (Supabase punya limit payload, aman di-batch 40 per request)
    for (let i=0; i<productRows.length; i+=40) {
      await sb.post('products', productRows.slice(i,i+40), 'return=minimal');
    }

    // Insert vendor prices
    if (MASTER_IMPORT_DATA.vendorPrices.length>0) {
      const vpRows = MASTER_IMPORT_DATA.vendorPrices.map(v => ({
        product_id: v.productId, vendor_name: v.vendor, harga: v.harga
      }));
      for (let i=0; i<vpRows.length; i+=40) {
        await sb.post('vendor_prices', vpRows.slice(i,i+40), 'return=minimal');
      }
    }

    // Buat adjustment "Stock Awal" + layer untuk produk yang punya stockAwal > 0
    const withStock = MASTER_IMPORT_DATA.products.filter(p=>p.stockAwal>0);
    toast(`Mencatat stock awal untuk ${withStock.length} produk...`, 'warn');
    const today = fmt.today();
    let adjCounter = 0;
    const adjRows = [], layerRows = [];
    withStock.forEach(p => {
      adjCounter++;
      const adjId = uid('adj');
      const nomor = `ADJ-${String(adjCounter).padStart(3,'0')}-IMPORT`;
      adjRows.push({ id:adjId, nomor, tanggal:today, product_id:p.id, qty:p.stockAwal, alasan:'Stock Awal', keterangan:'Import dari Price List 26 Agustus', harga_beli:p.hargaBeli });
      layerRows.push({ layer_id:uid('layer'), product_id:p.id, qty_remaining:p.stockAwal, harga_beli:p.hargaBeli, source_id:adjId, source_type:'adjustment', tanggal:today });
    });
    for (let i=0; i<adjRows.length; i+=40) await sb.post('adjustments', adjRows.slice(i,i+40), 'return=minimal');
    for (let i=0; i<layerRows.length; i+=40) await sb.post('layers', layerRows.slice(i,i+40), 'return=minimal');

    // Reset counters
    await sb.patch('counters', '?key=eq.purchase', { value: 0 });
    await sb.patch('counters', '?key=eq.sale', { value: 0 });
    await sb.patch('counters', '?key=eq.adjustment', { value: adjCounter });

    toast(`Import selesai! ${productRows.length} produk, ${MASTER_IMPORT_DATA.vendorPrices.length} harga vendor.`);
    setBadge('online');
    await loadAll();
  } catch(e) {
    console.error(e);
    setBadge('online');
    toast('Gagal import: '+e.message, 'err');
  }
}

function generateNumber(type) {
  const d=new Date(), dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0'),yy=String(d.getFullYear()).slice(-2);
  const n = (db.counters[type]||0)+1;
  if (type==='purchase') return `PO-${String(n).padStart(3,'0')}-${dd}${mm}${yy}`;
  if (type==='sale') return `INV-${String(n).padStart(4,'0')}-${dd}${mm}${yy}`;
  return `ADJ-${String(n).padStart(3,'0')}-${dd}${mm}${yy}`;
}

function getReorderList() {
  return db.products.filter(p=>p.buffer>0&&getStock(p.id)<p.buffer).map(p=>{
    const stock = getStock(p.id);
    const target = p.buffer + 1; // target stock setelah restock
    const qtyToOrder = Math.max(0, target - stock);
    const cheapest = getCheapestVendor(p.id);
    const unitPrice = cheapest ? cheapest.harga : p.hargaBeli;
    const vendorLabel = cheapest ? cheapest.vendor : null;
    const estCost = qtyToOrder * unitPrice;
    return { product:p, stock, target, qtyToOrder, unitPrice, vendorLabel, estCost };
  });
}

function renderProduk() {
  let list = db.products.map(p=>({ ...p, stock:getStock(p.id), nilaiStock:getStockValue(p.id), avgHpp:getAvgHpp(p.id), status: p.buffer>0&&getStock(p.id)<p.buffer?'warn':(getStock(p.id)<=0?'danger':'ok') }));
  const zeroCostCount = list.filter(p=>p.stock>0 && p.nilaiStock===0).length;
  if (produkSearch) { const q=produkSearch.toLowerCase(); list=list.filter(p=>p.nama.toLowerCase().includes(q)||(p.kode||'').toLowerCase().includes(q)); }
  if (produkSort==='nama') list.sort((a,b)=>a.nama.localeCompare(b.nama));
  else if (produkSort==='stock-asc') list.sort((a,b)=>a.stock-b.stock);
  else if (produkSort==='stock-desc') list.sort((a,b)=>b.stock-a.stock);
  else if (produkSort==='nilai-desc') list.sort((a,b)=>b.nilaiStock-a.nilaiStock);
  const totalNilai=list.reduce((a,p)=>a+p.nilaiStock,0);
  return `
  <div class="page-title">Daftar Produk</div>
  <div class="page-subtitle">${db.products.length} produk · Nilai stock: ${fmt.rp(totalNilai)}</div>
  ${zeroCostCount>0?`<div class="alert warn">⚠️ ${zeroCostCount} produk punya stock tapi harganya Rp 0 (belum ada info harga saat diinput). Klik Edit → "Layer FIFO" → "Koreksi" untuk perbaiki.</div>`:''}
  <div class="panel">
    <div class="panel-header">
      <div class="toolbar">
        <input type="text" class="search" id="produkSearch" placeholder="Cari nama atau kode..." value="${escapeHtml(produkSearch)}">
        <select id="produkSort"><option value="nama" ${produkSort==='nama'?'selected':''}>Nama</option><option value="stock-asc" ${produkSort==='stock-asc'?'selected':''}>Stock Terkecil</option><option value="stock-desc" ${produkSort==='stock-desc'?'selected':''}>Stock Terbesar</option><option value="nilai-desc" ${produkSort==='nilai-desc'?'selected':''}>Nilai Tertinggi</option></select>
      </div>
      <button class="btn primary" id="btnAddProduk">+ Produk Baru</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Produk</th><th>Kode</th><th>Satuan</th><th class="num" title="Harga referensi pembelian berikutnya">Harga Beli Ref.</th><th class="num" title="HPP rata-rata FIFO dari stock yang ada">HPP Rata2</th><th class="num">Harga Jual</th><th class="num">Stock</th><th class="num">Nilai Stock</th><th>Status</th><th>Vendor</th><th></th></tr></thead>
      <tbody>${list.length===0?`<tr><td colspan="11"><div class="empty"><div class="empty-icon">🔍</div>Tidak ada produk</div></td></tr>`:list.map(p=>{
        const diff=p.hargaBeli>0&&p.avgHpp>0?((p.hargaBeli-p.avgHpp)/p.avgHpp*100):0;
        const badge=Math.abs(diff)>=5?` <small style="color:${diff>0?'var(--warn)':'var(--ok)'}; font-size:10px">${diff>0?'↑':'↓'}${Math.abs(diff).toFixed(0)}%</small>`:'';
        const vendors=getVendorPrices(p.id);
        const vendorCell=vendors.length===0?`<small style="color:var(--text-dim)">—</small>`:`<small style="color:var(--ok)">${vendors[0].vendor} ${fmt.rp(vendors[0].harga)}</small>${vendors.length>1?` <small style="color:var(--text-dim)">+${vendors.length-1}</small>`:''}`;
        const zeroCostWarn = p.stock>0 && p.nilaiStock===0;
        return`<tr${zeroCostWarn?' style="background:rgba(239,68,68,0.05)"':''}><td><strong>${p.nama}</strong>${zeroCostWarn?' <span title="Stock ada tapi harga Rp 0" style="color:var(--danger)">⚠</span>':''}</td><td><small style="color:var(--text-dim)">${p.kode||'-'}</small></td><td>${p.satuan}</td><td class="num">${fmt.rp(p.hargaBeli)}${badge}</td><td class="num" style="color:var(--text-dim)">${p.stock>0?fmt.rp(p.avgHpp):'—'}</td><td class="num">${fmt.rp(p.hargaJual)}</td><td class="num"><strong>${fmt.num(p.stock)}</strong></td><td class="num"${zeroCostWarn?' style="color:var(--danger)"':''}>${fmt.rp(p.nilaiStock)}</td><td><span class="status ${p.status}">${p.status==='ok'?'Aman':p.status==='warn'?'Perlu Order':'Habis'}</span></td><td>${vendorCell}</td><td><button class="btn sm" data-edit-produk="${p.id}">Edit</button></td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

function renderRiwayat() {
  const combined = [
    ...db.purchases.map(p=>({...p,type:'purchase',label:'Pembelian',party:p.supplier})),
    ...db.sales.filter(s=>s.status!=='draft').map(s=>({...s,type:'sale',label:'Penjualan',party:s.customer})),
    ...db.adjustments.map(a=>{const p=getProduct(a.productId);return{...a,type:'adjustment',label:'Penyesuaian',party:a.alasan,items:[{productId:a.productId}],total:0,_product:p?p.nama:'-',_display:(a.qty>0?'+':'')+fmt.num(a.qty)+' '+(p?p.satuan:'')};})
  ].sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
  const filtered = riwayatTab==='all'?combined:riwayatTab==='beli'?combined.filter(x=>x.type==='purchase'):riwayatTab==='jual'?combined.filter(x=>x.type==='sale'):combined.filter(x=>x.type==='adjustment');
  const clr={purchase:'warn',sale:'ok',adjustment:'danger'};
  return `
  <div class="page-title">Riwayat Transaksi</div>
  <div class="tabs">
    <button class="${riwayatTab==='all'?'active':''}" data-tab="all">Semua (${combined.length})</button>
    <button class="${riwayatTab==='beli'?'active':''}" data-tab="beli">Pembelian (${db.purchases.length})</button>
    <button class="${riwayatTab==='jual'?'active':''}" data-tab="jual">Penjualan (${db.sales.length})</button>
    <button class="${riwayatTab==='adj'?'active':''}" data-tab="adj">Penyesuaian (${db.adjustments.length})</button>
  </div>
  <div class="panel"><div class="table-wrap"><table>
    <thead><tr><th>Tanggal</th><th>Tipe</th><th>No</th><th>Detail</th><th class="num">Qty/Item</th><th class="num">Total</th><th></th></tr></thead>
    <tbody>${filtered.length===0?`<tr><td colspan="7"><div class="empty">Tidak ada transaksi</div></td></tr>`:filtered.map(x=>{
      const va=x.type==='purchase'?`data-view-pembelian="${x.id}"`:x.type==='sale'?`data-view-penjualan="${x.id}"`:`data-view-adj="${x.id}"`;
      const detail=x.type==='adjustment'?`${x._product} · <small style="color:var(--text-dim)">${escapeHtml(x.party)}</small>`:escapeHtml(x.party);
      return`<tr><td>${fmt.date(x.tanggal)}</td><td><span class="status ${clr[x.type]}">${x.label}</span></td><td><strong>${x.nomor}</strong></td><td>${detail}</td><td class="num">${x.type==='adjustment'?x._display:x.items.length}</td><td class="num"><strong>${x.type==='adjustment'?'—':fmt.rp(x.total)}</strong></td><td><button class="btn sm" ${va}>Lihat</button></td></tr>`;
    }).join('')}</tbody>
  </table></div></div>
  <div class="panel"><div class="panel-header"><div class="panel-title">Import / Export</div></div>
  <div class="panel-body"><div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="btnExport">📥 Export JSON (backup)</button>
    <button class="btn" id="btnImportLocal">📤 Import dari JSON lama</button>
    <input type="file" id="fileImport" accept=".json" style="display:none">
  </div><div style="margin-top:10px;color:var(--text-dim);font-size:12px">Data tersimpan di Supabase — otomatis sync ke semua device. Export untuk backup tambahan.</div>
  </div></div>
  <div class="panel"><div class="panel-header"><div class="panel-title">Master Produk Baru (Price List 26 Agustus)</div></div>
  <div class="panel-body">
    <div style="color:var(--text-dim);font-size:13px;margin-bottom:12px">${MASTER_IMPORT_DATA.products.length} produk dengan harga jual + perbandingan harga dari ${new Set(MASTER_IMPORT_DATA.vendorPrices.map(v=>v.productId)).size} produk yang punya data vendor (Asia Jaya, TKP, Sentral Baut, Arengka).</div>
    <button class="btn danger" id="btnImportMaster">🔄 Hapus Semua & Import Data Baru</button>
  </div></div>`;
}

// ============================================================
// PAGE HANDLERS
// ============================================================
function attachPageHandlers() {
  const bind = (id, fn) => { const el=document.getElementById(id); if(el) el[fn.type||'onclick']=fn; };

  // Dashboard
  const tbe=document.getElementById('toggleBelanjaEstimasi'); if(tbe) tbe.onclick=()=>{showBelanjaEstimasi=!showBelanjaEstimasi;render();};
  document.querySelectorAll('[data-order-flag]').forEach(sel=>sel.onchange=(e)=>setOrderFlag(sel.dataset.orderFlag, e.target.value));

  // Produk
  const bap=document.getElementById('btnAddProduk'); if(bap) bap.onclick=()=>openProdukModal();
  document.querySelectorAll('[data-edit-produk]').forEach(b=>b.onclick=()=>openProdukModal(b.dataset.editProduk));
  const si=document.getElementById('produkSearch');
  if(si) si.oninput=e=>{produkSearch=e.target.value;render();setTimeout(()=>{const el=document.getElementById('produkSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0);};
  const ss=document.getElementById('produkSort'); if(ss) ss.onchange=e=>{produkSort=e.target.value;render();};

  // Pembelian
  const bapb=document.getElementById('btnAddPembelian'); if(bapb) bapb.onclick=()=>openTxModal('purchase');
  document.querySelectorAll('[data-view-pembelian]').forEach(b=>b.onclick=()=>viewTransaction('purchase',b.dataset.viewPembelian));
  document.querySelectorAll('[data-del-pembelian]').forEach(b=>b.onclick=()=>deleteTransaction('purchase',b.dataset.delPembelian));

  // Penjualan
  const bapj=document.getElementById('btnAddPenjualan'); if(bapj) bapj.onclick=()=>openTxModal('sale');
  document.querySelectorAll('[data-view-penjualan]').forEach(b=>b.onclick=()=>viewTransaction('sale',b.dataset.viewPenjualan));
  document.querySelectorAll('[data-del-penjualan]').forEach(b=>b.onclick=()=>deleteTransaction('sale',b.dataset.delPenjualan));
  document.querySelectorAll('[data-continue-draft]').forEach(b=>b.onclick=()=>openTxModal('sale', b.dataset.continueDraft));
  document.querySelectorAll('[data-penjualantab]').forEach(b=>b.onclick=()=>{penjualanTab=b.dataset.penjualantab;render();});

  // Riwayat
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{riwayatTab=b.dataset.tab;render();});
  document.querySelectorAll('[data-view-adj]').forEach(b=>b.onclick=()=>viewAdjustment(b.dataset.viewAdj));
  // Riwayat Harga
  const hs=document.getElementById('hargaSearch');
  if(hs) hs.oninput=e=>{hargaSearch=e.target.value;render();setTimeout(()=>{const el=document.getElementById('hargaSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0);};
  const hf=document.getElementById('hargaFilter'); if(hf) hf.onchange=e=>{hargaFilter=e.target.value;render();};
  const bil=document.getElementById('btnImportLocal'); if(bil) bil.onclick=()=>document.getElementById('fileImport').click();
  const bim=document.getElementById('btnImportMaster'); if(bim) bim.onclick=confirmImportMasterData;
  const fi=document.getElementById('fileImport'); if(fi) fi.onchange=importFromLocalJSON;

  // Biaya
  const bap2=document.getElementById('btnAddBiaya'); if(bap2) bap2.onclick=()=>openBiayaModal();
  document.querySelectorAll('[data-edit-biaya]').forEach(b=>b.onclick=()=>openBiayaModal(b.dataset.editBiaya));
  document.querySelectorAll('[data-del-biaya]').forEach(b=>b.onclick=()=>deleteBiaya(b.dataset.delBiaya));
  const bs=document.getElementById('biayaSearch');
  if(bs) bs.oninput=e=>{biayaSearch=e.target.value;render();setTimeout(()=>{const el=document.getElementById('biayaSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0);};
  const bkf=document.getElementById('biayaKategoriFilter'); if(bkf) bkf.onchange=e=>{biayaKategoriFilter=e.target.value;render();};
  document.querySelectorAll('[data-biayaperiod]').forEach(b=>b.onclick=()=>{biayaPeriodMode=b.dataset.biayaperiod;render();});

  // Laba Rugi
  document.querySelectorAll('[data-lrtab]').forEach(b=>b.onclick=()=>{labaRugiMode=b.dataset.lrtab;render();});
}

// ============================================================
function openProdukModal(id) {
  const p = id ? getProduct(id) : {nama:'',kode:'',satuan:'Pcs',hargaBeli:0,hargaJual:0,buffer:0};
  const stock = id ? getStock(id) : 0;
  const isEdit = !!id;
  const history = isEdit ? db.priceHistory.filter(h=>h.productId===id).slice(0,20) : [];
  const vendorList = isEdit ? getVendorPrices(id) : [];

  const historyHtml = history.length===0
    ? `<div class="empty" style="padding:24px"><div style="font-size:28px;margin-bottom:8px">📊</div>Belum ada riwayat perubahan harga</div>`
    : `<div class="table-wrap"><table>
        <thead><tr><th>Tanggal</th><th>Jenis</th><th class="num">Harga Lama</th><th class="num">Harga Baru</th><th class="num">Selisih</th><th class="num">%</th><th>Catatan</th></tr></thead>
        <tbody>${history.map(h=>{
          const naik=h.selisih>0;
          const jenis=h.field==='harga_beli'?'Harga Beli':'Harga Jual';
          const warna=naik?'var(--danger)':'var(--ok)';
          const tgl=new Date(h.createdAt).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
          return`<tr>
            <td style="font-size:12px">${tgl}</td>
            <td><span class="status ${h.field==='harga_beli'?'warn':'ok'}">${jenis}</span></td>
            <td class="num" style="color:var(--text-dim)">${fmt.rp(h.hargaLama)}</td>
            <td class="num"><strong>${fmt.rp(h.hargaBaru)}</strong></td>
            <td class="num" style="color:${warna}">${naik?'+':''}${fmt.rp(h.selisih)}</td>
            <td class="num" style="color:${warna}">${naik?'▲':'▼'}${Math.abs(h.pctChange).toFixed(1)}%</td>
            <td style="font-size:12px;color:var(--text-dim)">${escapeHtml(h.catatan)||'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;

  showModal(`
    <div class="modal-header"><div class="modal-title">${isEdit?'Edit Produk':'Produk Baru'}</div><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${isEdit?`<div class="tabs" style="margin-bottom:16px">
        <button class="active" data-ptab="info">Info & Harga</button>
        <button data-ptab="vendor">Vendor (${vendorList.length})</button>
        <button data-ptab="history">Riwayat Harga (${history.length})</button>
      </div>`:''}
      <div id="ptab-info">
        <div class="form-grid">
          <div class="form-field" style="grid-column:1/-1"><label>Nama Produk *</label><input type="text" id="pNama" value="${escapeHtml(p.nama)}"></div>
          <div class="form-field"><label>Kode</label><input type="text" id="pKode" value="${escapeHtml(p.kode)}"></div>
          <div class="form-field"><label>Satuan</label><input type="text" id="pSatuan" value="${escapeHtml(p.satuan)}"></div>
          <div class="form-field"><label>Harga Beli Ref. (Rp)</label><input type="number" id="pHargaBeli" value="${p.hargaBeli}" min="0" step="100"></div>
          <div class="form-field"><label>Harga Jual (Rp)</label><input type="number" id="pHargaJual" value="${p.hargaJual}" min="0" step="100"></div>
          <div class="form-field"><label>Buffer Stock</label><input type="number" id="pBuffer" value="${p.buffer}" min="0"></div>
          ${isEdit?`
          <div class="form-field" style="grid-column:1/-1"><label>Catatan Perubahan Harga (opsional)</label><input type="text" id="pCatatanHarga" placeholder="Contoh: Harga supplier naik per Mei 2026, info dari Pak Budi"></div>
          <div class="form-field"><label>Stock Saat Ini</label><div style="display:flex;gap:8px;align-items:center"><input type="text" value="${fmt.num(stock)} ${p.satuan}${stock>0?' · HPP avg '+fmt.rp(getAvgHpp(id)):''}" readonly style="color:var(--text-dim);flex:1"><button type="button" class="btn sm" id="pViewLayers">Layer FIFO</button><button type="button" class="btn sm" id="pAdjustStock">Sesuaikan</button></div></div>
          `:''}
        </div>
        ${isEdit?`<div class="alert info" style="margin-top:12px;font-size:12px">Perubahan harga beli/jual akan otomatis tercatat di tab Riwayat Harga.</div>`:''}
      </div>
      <div id="ptab-vendor" style="display:none">${isEdit?renderVendorTabContent(id):''}</div>
      <div id="ptab-history" style="display:none">${historyHtml}</div>
    </div>
    <div class="modal-footer">
      ${isEdit?`<button class="btn danger" onclick="deleteProduk('${id}')">Hapus</button>`:'<span></span>'}
      <div style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" id="pSave">${isEdit?'Simpan':'Tambah'}</button></div>
    </div>`);

  // Tab switching
  document.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-ptab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('ptab-info').style.display=b.dataset.ptab==='info'?'':'none';
    document.getElementById('ptab-vendor').style.display=b.dataset.ptab==='vendor'?'':'none';
    document.getElementById('ptab-history').style.display=b.dataset.ptab==='history'?'':'none';
    if(b.dataset.ptab==='vendor') attachVendorTabHandlers(id);
  });
  document.getElementById('pSave').onclick=()=>saveProduk(id);
  const ab=document.getElementById('pAdjustStock'); if(ab) ab.onclick=()=>openAdjustModal(id);
  const lb=document.getElementById('pViewLayers'); if(lb) lb.onclick=()=>openLayerModal(id);
  if(isEdit) attachVendorTabHandlers(id);
  document.getElementById('pNama').focus();
}

// ============================================================
// VENDOR TAB (di modal Produk) — perbandingan harga vendor
// ============================================================
function renderVendorTabContent(productId) {
  const p = getProduct(productId);
  const vendors = getVendorPrices(productId);
  const cheapest = vendors.length>0 ? vendors[0] : null;

  const rows = vendors.length===0
    ? `<tr><td colspan="4"><div class="empty" style="padding:20px"><div style="font-size:24px;margin-bottom:6px">🏷️</div>Belum ada data harga vendor untuk produk ini</div></td></tr>`
    : vendors.map(v => {
        const isCheapest = cheapest && v.id===cheapest.id;
        const tgl = v.updatedAt ? new Date(v.updatedAt).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) : '-';
        return `<tr style="${isCheapest?'background:rgba(34,197,94,0.06)':''}">
          <td><strong>${escapeHtml(v.vendor)}</strong>${isCheapest?' <span class="status ok">Termurah</span>':''}</td>
          <td class="num"><strong>${fmt.rp(v.harga)}</strong></td>
          <td style="font-size:12px;color:var(--text-dim)">${tgl}</td>
          <td>
            <button class="btn sm" data-vp-use="${v.id}" title="Pakai harga ini sebagai Harga Beli Ref.">Pakai</button>
            <button class="btn sm danger" data-vp-del="${v.id}">Hapus</button>
          </td>
        </tr>`;
      }).join('');

  return `
    <div class="alert info" style="margin-bottom:12px;font-size:12px">Bandingkan harga beli dari beberapa vendor untuk <strong>${escapeHtml(p.nama)}</strong>. Vendor termurah otomatis ditandai.</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Vendor</th><th class="num">Harga</th><th>Update Terakhir</th><th></th></tr></thead>
      <tbody id="vendorRows">${rows}</tbody>
    </table></div>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:flex-end;flex-wrap:wrap">
      <div class="form-field" style="flex:1;min-width:140px"><label>Nama Vendor</label><input type="text" id="vpNama" placeholder="Contoh: Asia Jaya" list="vendorSuggestions"></div>
      <div class="form-field" style="width:150px"><label>Harga (Rp)</label><input type="number" id="vpHarga" min="0" step="100"></div>
      <button class="btn primary" id="vpAdd">+ Tambah</button>
    </div>
    <datalist id="vendorSuggestions">${[...new Set(db.vendorPrices.map(v=>v.vendor))].map(v=>`<option value="${escapeHtml(v)}">`).join('')}</datalist>
  `;
}

function attachVendorTabHandlers(productId) {
  const addBtn = document.getElementById('vpAdd');
  if(addBtn) addBtn.onclick = () => addVendorPrice(productId);
  document.querySelectorAll('[data-vp-del]').forEach(b=>b.onclick=()=>deleteVendorPrice(b.dataset.vpDel, productId));
  document.querySelectorAll('[data-vp-use]').forEach(b=>b.onclick=()=>{
    const v = db.vendorPrices.find(x=>x.id===b.dataset.vpUse);
    if(v) { const inp=document.getElementById('pHargaBeli'); if(inp) inp.value=v.harga; toast(`Harga Beli Ref. diisi dari ${v.vendor}: ${fmt.rp(v.harga)} — klik Simpan untuk menerapkan`); }
  });
}

async function addVendorPrice(productId) {
  const nama = document.getElementById('vpNama').value.trim();
  const harga = Number(document.getElementById('vpHarga').value)||0;
  if(!nama) return toast('Nama vendor wajib diisi','err');
  if(harga<=0) return toast('Harga harus lebih dari 0','err');
  setBadge('syncing');
  try {
    // Cek kalau vendor ini sudah ada untuk produk ini -> update, bukan duplikat
    const existing = db.vendorPrices.find(v=>v.productId===productId && v.vendor.toLowerCase()===nama.toLowerCase());
    if(existing) {
      await sb.patch('vendor_prices', `?id=eq.${existing.id}`, { harga, updated_at:new Date().toISOString() });
      existing.harga = harga; existing.updatedAt = new Date().toISOString();
      toast(`Harga ${nama} diperbarui`);
    } else {
      const newId = uid('vp');
      await sb.post('vendor_prices',[{id:newId, product_id:productId, vendor_name:nama, harga}],'return=minimal');
      db.vendorPrices.push({id:newId, productId, vendor:nama, harga, updatedAt:new Date().toISOString()});
      toast(`Vendor ${nama} ditambahkan`);
    }
    setBadge('online');
    document.getElementById('ptab-vendor').innerHTML = renderVendorTabContent(productId);
    attachVendorTabHandlers(productId);
    render();
  } catch(e) { setBadge('online'); toast('Gagal: '+e.message,'err'); }
}

async function deleteVendorPrice(id, productId) {
  if(!confirm('Hapus data harga vendor ini?')) return;
  setBadge('syncing');
  try {
    await sb.delete('vendor_prices', `?id=eq.${id}`);
    db.vendorPrices = db.vendorPrices.filter(v=>v.id!==id);
    setBadge('online');
    document.getElementById('ptab-vendor').innerHTML = renderVendorTabContent(productId);
    attachVendorTabHandlers(productId);
    render();
  } catch(e) { setBadge('online'); toast('Gagal: '+e.message,'err'); }
}

async function setOrderFlag(productId, flag) {
  setBadge('syncing');
  try {
    await sb.patch('products', `?id=eq.${productId}`, { order_flag: flag || null });
    const p = getProduct(productId);
    if (p) p.orderFlag = flag;
    setBadge('online');
    render();
    toast(flag ? `Flag diset: ${ORDER_FLAGS[flag]?.label||flag}` : 'Flag dihapus');
  } catch(e) { setBadge('online'); toast('Gagal: '+e.message,'err'); }
}

async function saveProduk(id) {
  const nama=document.getElementById('pNama').value.trim();
  if(!nama) return toast('Nama produk wajib diisi','err');
  const data={ nama, kode:document.getElementById('pKode').value.trim(), satuan:document.getElementById('pSatuan').value.trim()||'Pcs', hargaBeli:Number(document.getElementById('pHargaBeli').value)||0, hargaJual:Number(document.getElementById('pHargaJual').value)||0, buffer:Number(document.getElementById('pBuffer').value)||0 };
  const catatan=document.getElementById('pCatatanHarga')?.value.trim()||'';
  setBadge('syncing');
  try {
    if(id) {
      const existing=getProduct(id);
      const priceChanges=[];
      // Cek perubahan harga beli
      if(existing.hargaBeli !== data.hargaBeli && data.hargaBeli > 0) {
        const selisih=data.hargaBeli-existing.hargaBeli;
        const pct=existing.hargaBeli>0?((selisih/existing.hargaBeli)*100):0;
        priceChanges.push({ product_id:id, field:'harga_beli', harga_lama:existing.hargaBeli, harga_baru:data.hargaBeli, selisih, pct_change:Math.round(pct*100)/100, catatan });
      }
      // Cek perubahan harga jual
      if(existing.hargaJual !== data.hargaJual && data.hargaJual > 0) {
        const selisih=data.hargaJual-existing.hargaJual;
        const pct=existing.hargaJual>0?((selisih/existing.hargaJual)*100):0;
        priceChanges.push({ product_id:id, field:'harga_jual', harga_lama:existing.hargaJual, harga_baru:data.hargaJual, selisih, pct_change:Math.round(pct*100)/100, catatan });
      }
      await sb.patch('products',`?id=eq.${id}`,{nama:data.nama,kode:data.kode,satuan:data.satuan,harga_beli:data.hargaBeli,harga_jual:data.hargaJual,buffer:data.buffer,updated_at:new Date().toISOString()});
      Object.assign(existing,data);
      // Simpan riwayat harga kalau ada perubahan
      if(priceChanges.length>0) {
        await sb.post('price_history', priceChanges, 'return=representation');
        priceChanges.forEach(h=>{
          db.priceHistory.unshift({ id:uid('ph'), productId:h.product_id, field:h.field, hargaLama:h.harga_lama, hargaBaru:h.harga_baru, selisih:h.selisih, pctChange:h.pct_change, catatan:h.catatan, createdAt:new Date().toISOString() });
        });
        toast(`Produk diperbarui · ${priceChanges.length} perubahan harga tercatat`);
      } else {
        toast('Produk diperbarui');
      }
    } else {
      const newId=uid('p');
      await sb.post('products',[{id:newId,nama:data.nama,kode:data.kode,satuan:data.satuan,harga_beli:data.hargaBeli,harga_jual:data.hargaJual,buffer:data.buffer}],'return=minimal');
      db.products.push({id:newId,...data});
      toast('Produk ditambahkan');
    }
    setBadge('online'); closeModal(); render();
  } catch(e) { setBadge('online'); toast('Gagal: '+e.message,'err'); }
}

async function deleteProduk(id) {
  if(!confirm('Yakin hapus produk ini?')) return;
  setBadge('syncing');
  try {
    await sb.delete('products',`?id=eq.${id}`);
    db.products=db.products.filter(p=>p.id!==id);
    setBadge('online'); closeModal(); render(); toast('Produk dihapus');
  } catch(e) { setBadge('online'); toast('Gagal: '+e.message,'err'); }
}

function openLayerModal(productId) {
  const p=getProduct(productId), layers=getLayersForProduct(productId);
  showModal(`
    <div class="modal-header"><div class="modal-title">Layer Stock FIFO — ${p.nama}</div><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="alert info" style="margin-bottom:16px">
        <div><strong>Total:</strong> ${fmt.num(getStock(productId))} ${p.satuan} · <strong>Nilai:</strong> ${fmt.rp(getStockValue(productId))}</div>
        <div><strong>HPP Avg:</strong> ${fmt.rp(getAvgHpp(productId))} · <strong>Harga Beli Ref.:</strong> ${fmt.rp(p.hargaBeli)}</div>
      </div>
      ${layers.some(l=>l.hargaBeli===0)?`<div class="alert warn" style="margin-bottom:16px">⚠️ Ada layer dengan harga Rp 0 (biasanya stock awal yang harganya belum diketahui saat diinput). Klik "Koreksi" untuk perbaiki.</div>`:''}
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Tanggal Masuk</th><th class="num">Qty Sisa</th><th class="num">Harga Beli</th><th class="num">Nilai</th><th>Sumber</th><th></th></tr></thead>
        <tbody id="layerRows">${layers.length===0?`<tr><td colspan="7"><div class="empty">Stock kosong</div></td></tr>`:layers.map((l,i)=>{
          let src='-';
          if(l.sourceType==='purchase'){const pur=db.purchases.find(x=>x.id===l.sourceId);src=pur?`PO: ${pur.nomor} (${pur.supplier})`:'Pembelian';}
          else if(l.sourceType==='adjustment'){const adj=db.adjustments.find(x=>x.id===l.sourceId);src=adj?`Adj: ${adj.alasan}`:'Adjustment';}
          const age=Math.floor((Date.now()-new Date(l.tanggal).getTime())/(86400000));
          const zeroWarn = l.hargaBeli===0 ? ' style="color:var(--danger)"' : '';
          return`<tr><td>${i+1}</td><td>${fmt.date(l.tanggal)} <small style="color:var(--text-dim)">(${age}hr)</small></td><td class="num"><strong>${fmt.num(l.qtyRemaining)}</strong></td><td class="num"${zeroWarn}>${fmt.rp(l.hargaBeli)}</td><td class="num">${fmt.rp(l.qtyRemaining*l.hargaBeli)}</td><td><small style="color:var(--text-dim)">${src}</small></td><td><button class="btn sm" data-edit-layer="${l.layerId}" data-product="${productId}">Koreksi</button></td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>
    <div class="modal-footer"><span style="color:var(--text-dim);font-size:12px">Urutan dari atas = dijual duluan (FIFO)</span><button class="btn ghost" onclick="closeModal()">Tutup</button></div>`);
  document.querySelectorAll('[data-edit-layer]').forEach(b=>b.onclick=()=>openEditLayerPrice(b.dataset.editLayer, b.dataset.product));
}

function openEditLayerPrice(layerId, productId) {

  if(!layer) return;

    <div class="modal-header"><div class="modal-title">Koreksi Harga Layer</div><button class="btn ghost" onclick="openLayerModal('${productId}')">✕</button></div>
    <div class="modal-body">
      <div class="alert info" style="margin-bottom:16px">
        <strong>${p.nama}</strong><br>
        Qty layer ini: ${fmt.num(layer.qtyRemaining)} ${p.satuan} · Tanggal masuk: ${fmt.date(layer.tanggal)}
      </div>
      <div class="form-field">
        <label>Harga Beli yang Benar (Rp)</label>
        <input type="number" id="editLayerHarga" value="${layer.hargaBeli}" min="0" step="100">

    <div class="modal-footer">
      <button class="btn ghost" onclick="openLayerModal('${productId}')">Batal</button>
      <button class="btn primary" id="btnSaveLayerPrice">Simpan Koreksi</button>
    </div>`);

  document.getElementById('btnSaveLayerPrice').onclick = () => saveLayerPriceCorrection(layerId, productId);
}

async function saveLayerPriceCorrection(layerId, productId) {
  const newHarga = Number(document.getElementById('editLayerHarga').value)||0;
  setBadge('syncing');
  try {
    await sb.patch('layers', `?layer_id=eq.${layerId}`, { harga_beli: newHarga });
    const layer = db.layers.find(l=>l.layerId===layerId);
    if(layer) layer.hargaBeli = newHarga;
    setBadge('online');
    toast('Harga layer dikoreksi');
    render();
    openLayerModal(productId);
  } catch(e) { setBadge('online'); toast('Gagal: '+e.message,'err'); }
}

function openAdjustModal(productId) {

  window._adjPid=productId; window._adjMode='set'; window._adjCur=cur;
  showModal(`
    <div class="modal-header"><div class="modal-title">Sesuaikan Stock</div><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="alert info" style="margin-bottom:16px"><strong>${p.nama}</strong> · Stock saat ini: <strong>${fmt.num(cur)} ${p.satuan}</strong></div>
      <div class="tabs" style="margin-bottom:16px">
        <button class="active" data-adj-tab="set">Set ke Angka</button>
        <button data-adj-tab="add">Tambah (+)</button>
        <button data-adj-tab="sub">Kurangi (−)</button>
      </div>
      <div id="adjTabContent"></div>
      <div class="form-grid" style="margin-top:16px">
        <div class="form-field"><label>Tanggal</label><input type="date" id="adjTanggal" value="${fmt.today()}"></div>
        <div class="form-field"><label>Alasan *</label><select id="adjAlasan"><option>Stock Opname</option><option>Stock Awal</option><option>Barang Rusak</option><option>Barang Hilang</option><option>Retur ke Supplier</option><option>Retur dari Customer</option><option>Koreksi</option><option>Lainnya</option></select></div>
        <div class="form-field" id="adjPriceField"><label>Harga Beli (untuk stock +)</label><input type="number" id="adjHargaBeli" value="${p.hargaBeli}" min="0" step="100"></div>
        <div class="form-field" style="grid-column:1/-1"><label>Keterangan</label><input type="text" id="adjKet" placeholder="Opsional"></div>
      </div>
    </div>

      <span style="color:var(--text-dim);font-size:12px">Tercatat di Riwayat</span>
      <div style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn primary" id="adjSave">Simpan</button></div>
    </div>`);
  document.querySelectorAll('[data-adj-tab]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-adj-tab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); window._adjMode=b.dataset.adjTab; renderAdjTab();
  });
  document.getElementById('adjSave').onclick=saveAdjustment;
  renderAdjTab();

function renderAdjTab() {
  const el=document.getElementById('adjTabContent'); if(!el) return;
  const p=getProduct(window._adjPid), cur=window._adjCur, mode=window._adjMode;
  const pf=document.getElementById('adjPriceField');
  if(mode==='set') {
    el.innerHTML=`<div class="form-field"><label>Set stock menjadi (${p.satuan})</label><input type="number" id="adjValue" value="${cur}" min="0" step="1"><div id="adjPreview" style="font-size:12px;color:var(--text-dim);margin-top:4px"></div></div>`;
    const inp=document.getElementById('adjValue');
    const upd=()=>{const v=Number(inp.value)||0,d=v-cur,s=d>=0?'+':'',c=d>0?'var(--ok)':d<0?'var(--danger)':'var(--text-dim)';document.getElementById('adjPreview').innerHTML=`Selisih: <strong style="color:${c}">${s}${fmt.num(d)} ${p.satuan}</strong>`;if(pf)pf.style.display=d>0?'':'none';};
    inp.oninput=upd; upd(); setTimeout(()=>inp.select(),50);
  } else if(mode==='add') {
    el.innerHTML=`<div class="form-field"><label>Jumlah yang ditambah (${p.satuan})</label><input type="number" id="adjValue" value="" min="1" step="1"><small id="adjPreview" style="color:var(--text-dim);font-size:12px"></small></div>`;
    const inp=document.getElementById('adjValue');
    inp.oninput=()=>{document.getElementById('adjPreview').textContent='Stock baru: '+fmt.num(cur+(Number(inp.value)||0));};
    if(pf) pf.style.display='';
    setTimeout(()=>inp.focus(),50);
  } else {
    el.innerHTML=`<div class="form-field"><label>Jumlah yang dikurangi (${p.satuan})</label><input type="number" id="adjValue" value="" min="1" step="1"><small id="adjPreview" style="color:var(--text-dim);font-size:12px"></small></div>`;
    const inp=document.getElementById('adjValue');
    inp.oninput=()=>{const ns=cur-(Number(inp.value)||0);const el2=document.getElementById('adjPreview');el2.textContent='Stock baru: '+fmt.num(ns);el2.style.color=ns<0?'var(--danger)':'var(--text-dim)';};
    if(pf) pf.style.display='none';
    setTimeout(()=>inp.focus(),50);
  }
}

async function saveAdjustment() {
  const p=getProduct(window._adjPid), cur=window._adjCur, mode=window._adjMode;
  const v=Number(document.getElementById('adjValue').value)||0;
  let delta=mode==='set'?v-cur:mode==='add'?v:-v;
  if(delta===0) return toast('Tidak ada perubahan','err');
  if(cur+delta<0&&!confirm(`Stock akan negatif (${fmt.num(cur+delta)}). Lanjutkan?`)) return;

  const tanggal=document.getElementById('adjTanggal').value;
  const alasan=document.getElementById('adjAlasan').value;
  const keterangan=document.getElementById('adjKet').value.trim();
  const hargaBeli=Number(document.getElementById('adjHargaBeli')?.value)||p.hargaBeli;
  const adjId=uid('adj');
  const nomor=generateNumber('adjustment');

  setBadge('syncing');
  try {
    let consumptions=[];
    if(delta>0) {
      // Buat layer baru
      const layerId=uid('layer');
      await sb.post('layers',[{layer_id:layerId,product_id:window._adjPid,qty_remaining:delta,harga_beli:hargaBeli,source_id:adjId,source_type:'adjustment',tanggal}],'return=minimal');
      db.layers.push({layerId,productId:window._adjPid,qtyRemaining:delta,hargaBeli:hargaBeli,sourceId:adjId,sourceType:'adjustment',tanggal});
    } else {
      // Consume layers FIFO
      const result=fifoConsumeLocal(window._adjPid,-delta,p.hargaBeli);
      consumptions=result.consumptions;
      // Update layers di DB
      await Promise.all(consumptions.filter(c=>c.layerId).map(c=>{
        const l=db.layers.find(x=>x.layerId===c.layerId);
        return sb.patch('layers',`?layer_id=eq.${c.layerId}`,{qty_remaining:l?l.qtyRemaining:0});
      }));
    }

    await sb.post('adjustments',[{id:adjId,nomor,tanggal,product_id:window._adjPid,qty:delta,alasan,keterangan,harga_beli:hargaBeli,consumptions}],'return=minimal');
    db.adjustments.unshift({id:adjId,nomor,tanggal,productId:window._adjPid,qty:delta,alasan,keterangan,hargaBeli,consumptions});
    await incrCounter('adjustment');

    setBadge('online'); closeModal(); render();
    toast(`Stock disesuaikan: ${delta>0?'+':''}${fmt.num(delta)} ${p.satuan}`);
  } catch(e) { setBadge('online'); toast('Gagal: '+e.message,'err'); fifoRestoreLocal(delta<0?[]:[]); }
}

async function viewAdjustment(id) {
  const adj=db.adjustments.find(a=>a.id===id); if(!adj) return;
  const p=getProduct(adj.productId), sign=adj.qty>0?'+':'', color=adj.qty>0?'var(--ok)':'var(--danger)';
  showModal(`
    <div class="modal-header"><div class="modal-title">Detail Penyesuaian</div><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="detail-row"><span class="label">No:</span><strong>${adj.nomor}</strong></div>
      <div class="detail-row"><span class="label">Tanggal:</span><strong>${fmt.date(adj.tanggal)}</strong></div>
      <div class="detail-row"><span class="label">Produk:</span><strong>${p?p.nama:'-'}</strong></div>
      <div class="detail-row"><span class="label">Perubahan:</span><strong style="color:${color}">${sign}${fmt.num(adj.qty)} ${p?p.satuan:''}</strong></div>
      <div class="detail-row"><span class="label">Alasan:</span><strong>${escapeHtml(adj.alasan)}</strong></div>
      ${adj.keterangan?`<div class="detail-row"><span class="label">Keterangan:</span><span>${escapeHtml(adj.keterangan)}</span></div>`:''}
    </div>
    <div class="modal-footer"><button class="btn danger" onclick="deleteAdjustment('${id}')">Hapus</button><button class="btn ghost" onclick="closeModal()">Tutup</button></div>`);
}

async function deleteAdjustment(id) {
  const adj=db.adjustments.find(a=>a.id===id); if(!adj) return;
  if(!confirm('Yakin hapus penyesuaian ini?')) return;
  setBadge('syncing');
  try {
    await sb.delete('adjustments',`?id=eq.${id}`);
    if(adj.qty>0) {
      // Hapus layer dari adjustment ini
      await sb.delete('layers',`?source_id=eq.${id}`);
      db.layers=db.layers.filter(l=>l.sourceId!==id);
    } else {
      // Restore layers
      fifoRestoreLocal(adj.consumptions);
      await Promise.all((adj.consumptions||[]).filter(c=>c.layerId).map(c=>{
        const l=db.layers.find(x=>x.layerId===c.layerId);
        return sb.patch('layers',`?layer_id=eq.${c.layerId}`,{qty_remaining:l?l.qtyRemaining:0});
      }));
    }
    db.adjustments=db.adjustments.filter(a=>a.id!==id);
    setBadge('online'); closeModal(); render(); toast('Penyesuaian dihapus');
  } catch(e) { setBadge('online'); toast('Gagal: '+e.message,'err'); }
}

function buildMarginRowHtml(idx, type) {
  const it = txDraft.items[idx];
  const prod = it.productId?getProduct(it.productId):null;
  if(!(type==='sale'&&prod&&it.qty>0&&it.hargaJual>0)) return '';
  if (!hppVisible) {
    return `<tr id="marginrow-${idx}"><td></td><td colspan="6" style="padding:2px 12px 8px;font-size:11px;border-bottom:1px solid var(--border)">
      <span style="color:var(--text-dim)">HPP & margin disembunyikan · klik 👁 di atas untuk lihat</span>
    </td><td></td></tr>`;
  }
  const sim=fifoSimulate(prod.id,it.qty,prod.hargaBeli);
  const diskon=it.diskon||0;
  const netSubtotal=(it.qty*it.hargaJual)-diskon;
  const mp=netSubtotal>0?((netSubtotal-sim.totalHpp)/netSubtotal*100):0;
  const ml=prod.hargaBeli>0?((it.hargaJual-prod.hargaBeli)/it.hargaJual*100):0;
  const mc=mp>=15?'var(--ok)':mp>=5?'var(--warn)':'var(--danger)';
  const lc=ml>=15?'var(--ok)':ml>=5?'var(--warn)':'var(--danger)';
  const bd=sim.batches.length>1?` · ${sim.batches.map(b=>`${fmt.num(b.qty)}×${fmt.rp(b.harga)}${b._fallback?' (fallback)':''}`).join(' + ')}`:' ';
  return `<tr id="marginrow-${idx}"><td></td><td colspan="6" style="padding:2px 12px 8px;font-size:11px;border-bottom:1px solid var(--border)">
    <span style="color:var(--text-dim)">HPP FIFO:</span> <strong>${fmt.rp(sim.avgHpp)}</strong>${bd}·
    <span style="color:var(--text-dim)">Margin:</span> <strong style="color:${mc}">${mp.toFixed(1)}%</strong> ·
    <span style="color:var(--text-dim)">vs Harga Baru (${fmt.rp(prod.hargaBeli)}):</span> <strong style="color:${lc}">${ml.toFixed(1)}%</strong>
    ${diskon>0?` · <span style="color:var(--warn)">Potongan: ${fmt.rp(diskon)}</span>`:''}
    ${mp<5?`<br><span style="color:var(--danger)">⚠ Margin tipis!</span>`:''}
    ${sim.shortfall>0?`<br><span style="color:var(--danger)">⚠ Shortfall ${fmt.num(sim.shortfall)} ${prod.satuan}</span>`:''}
  </td><td></td></tr>`;
}

function renderTxItems(type) {
  const body=document.getElementById('txItemsBody'); if(!body) return;
  const priceField=type==='purchase'?'hargaBeli':'hargaJual';

  body.innerHTML=txDraft.items.map((it,idx)=>{
    const prod=it.productId?getProduct(it.productId):null, stock=prod?getStock(prod.id):0;
    const marginRow = buildMarginRowHtml(idx, type);
    let vendorRow='';
    if(type==='purchase'&&prod){
      const vendors=getVendorPrices(prod.id);
      if(vendors.length>0){
        const cheapest=vendors[0];
        vendorRow=`<tr><td></td><td colspan="4" style="padding:2px 12px 8px;font-size:11px;border-bottom:1px solid var(--border)">
          <span style="color:var(--text-dim)">Perbandingan vendor:</span>
          ${vendors.map(v=>{
            const isCheap=v.id===cheapest.id;
            return `<span data-use-vendor="${idx}" data-vendor-harga="${v.harga}" style="cursor:pointer;margin-right:10px;${isCheap?'color:var(--ok);font-weight:500':'color:var(--text-dim)'}" title="Klik untuk pakai harga ini">${escapeHtml(v.vendor)}: ${fmt.rp(v.harga)}${isCheap?' ✓':''}</span>`;
          }).join('')}
        </td></tr>`;
      }
    }
    return `<tr>
      <td class="col-no">${idx+1}</td>
      <td><div class="combobox" data-idx="${idx}">
        <div class="combobox-input-wrap">
          <input type="text" class="cb-input" placeholder="Ketik 'ho', kode..." value="${prod?escapeHtml(prod.nama):''}" autocomplete="off" spellcheck="false">
          <button type="button" class="combobox-clear ${prod?'show':''}" data-cb-clear="${idx}">×</button>
        </div>
        <div class="combobox-list"></div>
        ${prod?`<div style="font-size:11px;color:var(--text-dim);margin-top:4px">${prod.kode||'-'} · Stock: ${fmt.num(stock)} ${prod.satuan}${type==='sale'&&stock<it.qty?' <span style="color:var(--danger)">⚠</span>':''}</div>`:''}
      </div></td>
      <td class="col-qty"><input type="number" class="num" data-field="qty" data-idx="${idx}" value="${it.qty||''}" min="0" step="1"></td>
      <td class="col-price"><input type="number" class="num" data-field="${priceField}" data-idx="${idx}" value="${it[priceField]||''}" min="0" step="100"></td>
      ${type==='sale'?`<td class="col-price"><input type="number" class="num" data-field="diskon" data-idx="${idx}" value="${it.diskon||''}" min="0" step="500" placeholder="0" style="color:var(--warn)"></td>`:''}
      ${type==='sale'?`<td class="col-price num" style="color:var(--text-dim)" id="cell-hpp-${idx}">${hppVisible?fmt.num(it.hpp||0):'×××'}</td>`:''}
      <td class="col-total num" id="cell-subtotal-${idx}"><strong>${fmt.rp(it.subtotal)}</strong></td>
      ${type==='sale'?`<td class="col-total num" id="cell-profit-${idx}" style="color:${it.profit>=0?'var(--ok)':'var(--danger)'}">${hppVisible?fmt.rp(it.profit):'×××'}</td>`:''}
      <td class="col-act"><button class="remove-btn" data-remove="${idx}">×</button></td>
    </tr>${marginRow}${vendorRow}`;
  }).join('');

  // Input handlers — update SEL yang bergantung saja, jangan sentuh input yang lagi diketik
  body.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.oninput=e=>{
      const idx=parseInt(e.target.dataset.idx), field=e.target.dataset.field;
      txDraft.items[idx][field]=Number(e.target.value)||0;
      recalcItem(idx,type);
      updateItemCellsOnly(idx, type);
      updateTotalsDisplayOnly(type);
    };
  });
  body.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=e=>{txDraft.items.splice(parseInt(e.target.dataset.remove),1);renderTxItems(type);updateTotals(type);});

  // Klik nama vendor -> pakai harganya sebagai harga beli item ini
  body.querySelectorAll('[data-use-vendor]').forEach(el=>{
    el.onclick=()=>{
      const idx=parseInt(el.dataset.useVendor), harga=Number(el.dataset.vendorHarga);
      txDraft.items[idx].hargaBeli=harga;
      recalcItem(idx,type);
      renderTxItems(type);
      updateTotals(type);
    };
  });

  // Combobox
  body.querySelectorAll('.combobox').forEach(cb=>{
    const idx=parseInt(cb.dataset.idx), input=cb.querySelector('.cb-input'), list=cb.querySelector('.combobox-list'), clearBtn=cb.querySelector('[data-cb-clear]');
    let activeIdx=-1;
    function escR(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
    function hl(text,q){if(!q)return escapeHtml(text);try{return escapeHtml(text).replace(new RegExp('('+escR(escapeHtml(q))+')','gi'),'<mark>$1</mark>');}catch{return escapeHtml(text);}}
    function matches(){
      const q=input.value.toLowerCase().trim(), toks=q.split(/\s+/).filter(Boolean);
      let res=q?db.products.filter(p=>toks.every(t=>(p.nama+' '+(p.kode||'')).toLowerCase().includes(t))):db.products.slice().sort((a,b)=>a.nama.localeCompare(b.nama));
      if(q) res.sort((a,b)=>{const as=a.nama.toLowerCase().startsWith(q);const bs=b.nama.toLowerCase().startsWith(q);return as===bs?a.nama.localeCompare(b.nama):as?-1:1;});
      return res.slice(0,30);
    }
    function renderList(){
      const q=input.value.toLowerCase().trim(), ms=matches();
      list.innerHTML=ms.length===0?`<div style="padding:12px;color:var(--text-dim);font-size:12px;text-align:center">Tidak ada produk "${escapeHtml(q)}"</div>`:ms.map((p,i)=>`<div class="combobox-item ${i===activeIdx?'active':''}" data-pid="${p.id}" data-i="${i}"><div>${hl(p.nama,input.value.trim())}</div><div class="meta">${p.kode?hl(p.kode,input.value.trim())+' · ':''}Beli: ${fmt.rp(p.hargaBeli)} · Jual: ${fmt.rp(p.hargaJual)} · Stock: ${fmt.num(getStock(p.id))} ${p.satuan}</div></div>`).join('');
      list.classList.add('open');
      list.querySelectorAll('[data-pid]').forEach(item=>{
        const select=()=>{
          const p=getProduct(item.dataset.pid); if(!p) return;
          txDraft.items[idx].productId=p.id;
          if(type==='purchase') txDraft.items[idx].hargaBeli=p.hargaBeli;
          else{txDraft.items[idx].hargaJual=p.hargaJual;txDraft.items[idx].hpp=getOldestLayerPrice(p.id)||p.hargaBeli;}
          recalcItem(idx,type); list.classList.remove('open'); renderTxItems(type); updateTotals(type);
          setTimeout(()=>{const q=document.querySelector(`input[data-field="qty"][data-idx="${idx}"]`);if(q){q.focus();q.select();}},20);
        };
        item.onmousedown=e=>{e.preventDefault();select();};
        item.ontouchstart=e=>{e.preventDefault();select();};
        item.onmouseenter=()=>{activeIdx=parseInt(item.dataset.i);list.querySelectorAll('.combobox-item').forEach(x=>x.classList.remove('active'));item.classList.add('active');};
      });
    }
    input.oninput=()=>{activeIdx=-1;if(clearBtn)clearBtn.classList.toggle('show',input.value.length>0);renderList();};
    input.onfocus=()=>renderList();
    input.onkeydown=e=>{
      if(e.key==='ArrowDown'){e.preventDefault();const items=list.querySelectorAll('.combobox-item');if(!items.length)return;activeIdx=(activeIdx+1)%items.length;items.forEach(x=>x.classList.remove('active'));items[activeIdx].classList.add('active');items[activeIdx].scrollIntoView({block:'nearest'});}
      else if(e.key==='ArrowUp'){e.preventDefault();const items=list.querySelectorAll('.combobox-item');if(!items.length)return;activeIdx=(activeIdx-1+items.length)%items.length;items.forEach(x=>x.classList.remove('active'));items[activeIdx].classList.add('active');items[activeIdx].scrollIntoView({block:'nearest'});}
      else if(e.key==='Enter'){e.preventDefault();const items=list.querySelectorAll('.combobox-item');const target=activeIdx>=0&&items[activeIdx]?items[activeIdx]:items.length===1?items[0]:null;if(target)target.onmousedown(new Event('mousedown'));}
      else if(e.key==='Escape')list.classList.remove('open');
    };
    input.onblur=()=>setTimeout(()=>list.classList.remove('open'),200);
    if(clearBtn) clearBtn.onmousedown=e=>{e.preventDefault();txDraft.items[idx].productId='';txDraft.items[idx].hargaBeli=0;txDraft.items[idx].hargaJual=0;txDraft.items[idx].hpp=0;recalcItem(idx,type);renderTxItems(type);updateTotals(type);setTimeout(()=>{const ni=document.querySelector(`.combobox[data-idx="${idx}"] .cb-input`);if(ni)ni.focus();},20);};
  });
  updateTotals(type);
}

function recalcItem(idx, type) {
  const it=txDraft.items[idx];
  if(type==='purchase') { it.subtotal=(it.qty||0)*(it.hargaBeli||0); }
  else {
    const diskon = it.diskon||0;
    const gross = (it.qty||0)*(it.hargaJual||0);
    it.subtotal = Math.max(0, gross - diskon);
    if(it.productId&&it.qty>0){const sim=fifoSimulate(it.productId,it.qty,getProduct(it.productId)?.hargaBeli||0);it.hpp=sim.avgHpp;it.profit=it.subtotal-sim.totalHpp;}
    else{it.hpp=0;it.profit=0;}
  }
}

// Update sel-sel yang bergantung (Subtotal/HPP/Profit/baris margin) TANPA menyentuh
// elemen <input> yang sedang diketik user — supaya kursor/ketikan tidak terganggu.
function updateItemCellsOnly(idx, type) {
  const it = txDraft.items[idx];
  const subtotalCell = document.getElementById(`cell-subtotal-${idx}`);
  if (subtotalCell) subtotalCell.innerHTML = `<strong>${fmt.rp(it.subtotal)}</strong>`;

  if (type==='sale') {
    const hppCell = document.getElementById(`cell-hpp-${idx}`);
    if (hppCell) hppCell.textContent = hppVisible?fmt.num(it.hpp||0):'×××';
    const profitCell = document.getElementById(`cell-profit-${idx}`);
    if (profitCell) {
      profitCell.textContent = hppVisible?fmt.rp(it.profit):'×××';
      profitCell.style.color = it.profit>=0?'var(--ok)':'var(--danger)';
    }
    // Baris margin: update kalau sudah ada, insert kalau baru muncul, hapus kalau sudah tidak relevan
    const existingMarginRow = document.getElementById(`marginrow-${idx}`);
    const newMarginHtml = buildMarginRowHtml(idx, type);
    if (newMarginHtml) {
      if (existingMarginRow) {
        existingMarginRow.outerHTML = newMarginHtml; // aman: baris ini tidak berisi <input>
      } else {
        const mainRow = subtotalCell ? subtotalCell.closest('tr') : null;
        if (mainRow) mainRow.insertAdjacentHTML('afterend', newMarginHtml);
      }
    } else if (existingMarginRow) {
      existingMarginRow.remove();
    }
  }
}

function updateTotals(type) {
  recalcTotals(type);
  const el=document.getElementById('txTotals'); if(!el) return;
  const total=txDraft.total, profit=txDraft.totalProfit, diskonTotal=txDraft.diskonTotal||0;
  if(type==='purchase') {
    el.innerHTML=`<div class="totals-row big"><span>Total Pembelian:</span> <strong id="totals-total-val">${fmt.rp(total)}</strong></div>`;
  } else {
    const m=total>0?((profit/total)*100).toFixed(1):0;
    el.innerHTML=`
      <div class="totals-row" style="width:100%;justify-content:space-between;align-items:center">
        <span style="color:var(--text-dim);font-size:12px">Diskon Total (opsional, potong dari total keseluruhan)</span>
        <input type="number" id="txDiskonTotal" value="${diskonTotal||''}" min="0" step="500" placeholder="0" style="width:140px;color:var(--warn)">
      </div>
      <div class="totals-row"><span>Profit:</span> <strong class="profit ${profit<0?'neg':''}" id="totals-profit-val">${hppVisible?`${fmt.rp(profit)} (${m}%)`:'×××'}</strong></div>
      <div class="totals-row big"><span>Total Penjualan:</span> <strong id="totals-total-val">${fmt.rp(total)}</strong></div>`;
    const dtInput = document.getElementById('txDiskonTotal');
    // Update ringan saja saat mengetik — JANGAN rebuild innerHTML div ini (akan menghancurkan input yang sedang diketik)
    if (dtInput) dtInput.oninput = (e) => {
      txDraft.diskonTotal = Number(e.target.value)||0;
      updateTotalsDisplayOnly(type);
    };
  }
}

// Hitung ulang total/profit dari items + diskonTotal, simpan ke txDraft (tanpa sentuh DOM)
function recalcTotals(type) {
  let total=0,profit=0;
  txDraft.items.forEach(it=>{total+=it.subtotal||0;profit+=it.profit||0;});
  const diskonTotal = txDraft.diskonTotal||0;
  total = Math.max(0, total - diskonTotal);
  profit = profit - diskonTotal;
  txDraft.total=total; txDraft.totalProfit=profit;
}

// Update tampilan Profit & Total TANPA menyentuh input Diskon Total atau input lain
function updateTotalsDisplayOnly(type) {
  recalcTotals(type);
  const total=txDraft.total, profit=txDraft.totalProfit;
  document.getElementById('totals-total-val') && (document.getElementById('totals-total-val').textContent=fmt.rp(total));
  if (type==='sale') {
    const m=total>0?((profit/total)*100).toFixed(1):0;
    const profitEl=document.getElementById('totals-profit-val');
    if (profitEl) {
      profitEl.textContent = hppVisible?`${fmt.rp(profit)} (${m}%)`:'×××';
      profitEl.classList.toggle('neg', profit<0);
    }
  }
}

async function saveTransaction(type, asDraft, isDraftEdit) {
  const partyField=type==='purchase'?'supplier':'customer';
  if(!txDraft[partyField]?.trim()) return toast(`Nama ${partyField} wajib diisi`,'err');
  const validItems=txDraft.items.filter(it=>it.productId&&it.qty>0);
  if(validItems.length===0) return toast('Minimal 1 item dengan qty > 0','err');

  // Cek overstock untuk sale — hanya relevan kalau benar-benar mengunci stock (bukan draft)
  if(type==='sale' && !asDraft){
    const over=validItems.filter(it=>it.qty>getStock(it.productId)).map(it=>{const p=getProduct(it.productId);return`${p.nama}: minta ${fmt.num(it.qty)}, ada ${fmt.num(getStock(it.productId))}`;});
    if(over.length>0&&!confirm('Stock tidak cukup:\n'+over.join('\n')+'\n\nLanjutkan? (pakai HPP fallback)')) return;
  }

  setBadge('syncing');
  try {
    if(type==='purchase') {
      // Pembelian selalu langsung final, tidak ada mode draft
      await sb.post('purchases',[{id:txDraft.id,nomor:txDraft.nomor,tanggal:txDraft.tanggal,supplier:txDraft.supplier,total:validItems.reduce((a,it)=>a+it.subtotal,0)}],'return=minimal');
      const items=validItems.map(it=>({purchase_id:txDraft.id,product_id:it.productId,qty:it.qty,harga_beli:it.hargaBeli,subtotal:it.subtotal}));
      await sb.post('purchase_items',items,'return=minimal');
      const layers=validItems.map(it=>({layer_id:uid('layer'),product_id:it.productId,qty_remaining:it.qty,harga_beli:it.hargaBeli,source_id:txDraft.id,source_type:'purchase',tanggal:txDraft.tanggal}));
      await sb.post('layers',layers,'return=minimal');
      await Promise.all(validItems.map(it=>sb.patch('products',`?id=eq.${it.productId}`,{harga_beli:it.hargaBeli})));
      validItems.forEach(it=>{const p=getProduct(it.productId);if(p)p.hargaBeli=it.hargaBeli;});
      txDraft.total=validItems.reduce((a,it)=>a+it.subtotal,0);
      txDraft.items=validItems;
      db.purchases.unshift({...txDraft});
      layers.forEach(l=>db.layers.push({layerId:l.layer_id,productId:l.product_id,qtyRemaining:l.qty_remaining,hargaBeli:l.harga_beli,sourceId:l.source_id,sourceType:l.source_type,tanggal:l.tanggal}));
      await incrCounter('purchase');
      toast('Pembelian disimpan');
    } else if (asDraft) {
      // --- SIMPAN SEBAGAI DRAFT: tidak menyentuh stock sama sekali ---
      const diskonTotal = txDraft.diskonTotal||0;
      const grossAmount = validItems.reduce((a,it)=>a+Math.max(0,(it.qty||0)*(it.hargaJual||0)-(it.diskon||0)),0);
      const totalAmount = Math.max(0, grossAmount - diskonTotal);
      // HPP/profit di draft cuma preview (simulasi, tidak mengunci layer)
      const previewItems = validItems.map(it=>{
        const p=getProduct(it.productId);
        const sim = fifoSimulate(it.productId, it.qty, p?.hargaBeli||0);
        const diskon = it.diskon||0;
        const subtotal = Math.max(0, it.qty*it.hargaJual - diskon);
        return { ...it, diskon, subtotal, hpp: sim.avgHpp, profit: subtotal-sim.totalHpp, consumptions: [] };
      });
      const totalProfitPreview = previewItems.reduce((a,it)=>a+it.profit,0) - diskonTotal;

      if (isDraftEdit) {
        // Update draft yang sudah ada
        await sb.patch('sales', `?id=eq.${txDraft.id}`, { nomor:txDraft.nomor, tanggal:txDraft.tanggal, customer:txDraft.customer, total:totalAmount, total_profit:totalProfitPreview, status:'draft', diskon_total:diskonTotal });
        await sb.delete('sale_items', `?sale_id=eq.${txDraft.id}`);
        const sItems=previewItems.map(it=>({sale_id:txDraft.id,product_id:it.productId,qty:it.qty,harga_jual:it.hargaJual,diskon:it.diskon,hpp:it.hpp,subtotal:it.subtotal,profit:it.profit,consumptions:[]}));
        await sb.post('sale_items',sItems,'return=minimal');
        const idx = db.sales.findIndex(s=>s.id===txDraft.id);
        const updated = {id:txDraft.id,nomor:txDraft.nomor,tanggal:txDraft.tanggal,customer:txDraft.customer,total:totalAmount,totalProfit:totalProfitPreview,status:'draft',diskonTotal,items:previewItems};
        if (idx>=0) db.sales[idx]=updated; else db.sales.unshift(updated);
        toast('Draft diperbarui');
      } else {
        // Draft baru
        await sb.post('sales',[{id:txDraft.id,nomor:txDraft.nomor,tanggal:txDraft.tanggal,customer:txDraft.customer,total:totalAmount,total_profit:totalProfitPreview,status:'draft',diskon_total:diskonTotal}],'return=minimal');
        const sItems=previewItems.map(it=>({sale_id:txDraft.id,product_id:it.productId,qty:it.qty,harga_jual:it.hargaJual,diskon:it.diskon,hpp:it.hpp,subtotal:it.subtotal,profit:it.profit,consumptions:[]}));
        await sb.post('sale_items',sItems,'return=minimal');
        db.sales.unshift({id:txDraft.id,nomor:txDraft.nomor,tanggal:txDraft.tanggal,customer:txDraft.customer,total:totalAmount,totalProfit:totalProfitPreview,status:'draft',diskonTotal,items:previewItems});
        await incrCounter('sale');
        toast('Draft disimpan — stock belum berkurang');
      }
    } else {
      // --- SELESAIKAN PENJUALAN: konsumsi FIFO beneran, kunci stock ---
      const diskonTotal = txDraft.diskonTotal||0;
      let totalProfit=0, totalAmount=0;
      const processedItems=[];
      for(const it of validItems){
        const p=getProduct(it.productId);
        const result=fifoConsumeLocal(it.productId,it.qty,p?.hargaBeli||0);
        const diskon = it.diskon||0;
        const subtotal=Math.max(0, it.qty*it.hargaJual - diskon);
        const profit=subtotal-result.totalHpp;
        totalProfit+=profit; totalAmount+=subtotal;
        processedItems.push({...it,diskon,subtotal,hpp:result.avgHpp,profit,consumptions:result.consumptions});
      }
      totalAmount = Math.max(0, totalAmount - diskonTotal);
      totalProfit = totalProfit - diskonTotal;
      const layerUpdates={};
      processedItems.forEach(it=>it.consumptions.forEach(c=>{if(c.layerId){const l=db.layers.find(x=>x.layerId===c.layerId);if(l&&!layerUpdates[c.layerId])layerUpdates[c.layerId]=l.qtyRemaining;}}));

      if (isDraftEdit) {
        // Finalisasi draft yang sudah ada -> update record yang sama, jangan insert baru, jangan increment counter lagi
        await sb.patch('sales', `?id=eq.${txDraft.id}`, { nomor:txDraft.nomor, tanggal:txDraft.tanggal, customer:txDraft.customer, total:totalAmount, total_profit:totalProfit, status:'final', diskon_total:diskonTotal });
        await sb.delete('sale_items', `?sale_id=eq.${txDraft.id}`);
        const sItems=processedItems.map(it=>({sale_id:txDraft.id,product_id:it.productId,qty:it.qty,harga_jual:it.hargaJual,diskon:it.diskon,hpp:it.hpp,subtotal:it.subtotal,profit:it.profit,consumptions:it.consumptions}));
        await sb.post('sale_items',sItems,'return=minimal');
        await Promise.all(Object.entries(layerUpdates).map(([lid,qty])=>sb.patch('layers',`?layer_id=eq.${lid}`,{qty_remaining:qty})));
        const idx = db.sales.findIndex(s=>s.id===txDraft.id);
        const updated = {id:txDraft.id,nomor:txDraft.nomor,tanggal:txDraft.tanggal,customer:txDraft.customer,total:totalAmount,totalProfit,status:'final',diskonTotal,items:processedItems};
        if (idx>=0) db.sales[idx]=updated; else db.sales.unshift(updated);
        toast('Penjualan diselesaikan — stock sudah dipotong');
      } else {
        // Penjualan baru langsung final (tanpa lewat draft)
        await sb.post('sales',[{id:txDraft.id,nomor:txDraft.nomor,tanggal:txDraft.tanggal,customer:txDraft.customer,total:totalAmount,total_profit:totalProfit,status:'final',diskon_total:diskonTotal}],'return=minimal');
        const sItems=processedItems.map(it=>({sale_id:txDraft.id,product_id:it.productId,qty:it.qty,harga_jual:it.hargaJual,diskon:it.diskon,hpp:it.hpp,subtotal:it.subtotal,profit:it.profit,consumptions:it.consumptions}));
        await sb.post('sale_items',sItems,'return=minimal');
        await Promise.all(Object.entries(layerUpdates).map(([lid,qty])=>sb.patch('layers',`?layer_id=eq.${lid}`,{qty_remaining:qty})));
        db.sales.unshift({id:txDraft.id,nomor:txDraft.nomor,tanggal:txDraft.tanggal,customer:txDraft.customer,total:totalAmount,totalProfit,status:'final',diskonTotal,items:processedItems});
        await incrCounter('sale');
        toast('Penjualan disimpan');
      }
    }
    setBadge('online'); closeModalTx(); render();
  } catch(e) { console.error(e); setBadge('online'); toast('Gagal simpan: '+e.message,'err'); }
}

    const p=getProduct(it.productId);
    if(type==='purchase') return`<tr><td>${i+1}</td><td><strong>${p?p.nama:'—'}</strong></td><td class="num">${fmt.num(it.qty)}</td><td class="num">${fmt.rp(it.hargaBeli)}</td><td class="num"><strong>${fmt.rp(it.subtotal)}</strong></td></tr>`;
    const batchHtml=(hppVisible && it.consumptions && it.consumptions.length>1)?`<tr><td></td><td colspan="7" style="padding-top:0;padding-bottom:8px;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--border)">Batch: ${it.consumptions.map(c=>`${fmt.num(c.qty)}×${fmt.rp(c.hargaBeli)}${c._shortfall?' (fallback)':''}`).join(' + ')}</td></tr>`:'';
